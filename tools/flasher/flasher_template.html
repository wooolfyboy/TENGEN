<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TENGEN __VER__</title>
<style>
__FONTS__
:root{--bg:#02090b;--panel:#071419;--line:#12303a;--acc:#3fd9ff;--hot:#eafcff;--steel:#7f97a3;--alert:#ff8a3d;--ok:#7dffb0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--hot);font:16px/1.5 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
main{max-width:620px;margin:0 auto;padding:32px 16px 60px}
h1{color:var(--acc);font:600 26px/1.1 'Exo 2','Arial Narrow',sans-serif;letter-spacing:.08em;margin:0}.ver{color:var(--steel);margin:2px 0 24px}
.top{display:flex;align-items:center;gap:12px}.sp{flex:1}.lg{display:flex;gap:4px}.lg button{width:auto;padding:6px 10px;background:transparent;color:var(--steel);border:1px solid var(--line);font-weight:600}.lg button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);padding:18px;margin-bottom:16px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
button{background:var(--acc);color:var(--bg);border:0;font:inherit;font-weight:700;letter-spacing:.06em;padding:16px;cursor:pointer;width:100%}
button:disabled{background:var(--line);color:var(--steel);cursor:default}
.bar{height:12px;background:#0b2630;margin-top:16px}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#st{margin-top:10px;min-height:1.5em}.ok{color:var(--ok)}.bad{color:var(--alert)}
ol{padding-left:22px;margin:0}li{margin:5px 0}b{color:var(--acc)}
details{color:var(--steel);font-size:13px}pre{white-space:pre-wrap;max-height:200px;overflow:auto;margin:6px 0 0}
</style></head><body><main>
<div class="top"><h1>// TENGEN</h1><span class="sp"></span><div class="lg"><button data-l="en">EN</button><button data-l="ru">RU</button></div></div>
<div class="ver" data-t="sub"></div>

<div class="card">
 <button id="go" data-t="btn"></button>
 <div class="bar"><i id="bar"></i></div>
 <div id="st" data-t="idle"></div>
</div>

<div class="card"><ol>
 <li data-h="s1"></li>
 <li data-h="s2"></li>
 <li data-h="s3"></li>
 <li data-h="s4"></li>
</ol>
<p style="color:var(--steel);font-size:14px;margin:12px 0 0" data-h="note"></p></div>

<details><summary data-t="details"></summary><pre id="log"></pre></details>
</main>
<!-- esptool-js: separate module (own variable names) -->
<script type="module">
__ESPTOOL__
</script>
<script type="module">
const { ESPLoader, Transport } = window.__esptool;
const TX = __JS_TEXT__;                       // page texts in both languages
let LG = 'en';
try { LG = localStorage.getItem('lang') || ((navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en'); } catch (e) {}
let T = TX[LG];
const applyLang = l => {
  LG = TX[l] ? l : 'en'; T = TX[LG]; document.documentElement.lang = LG;
  try { localStorage.setItem('lang', LG); } catch (e) {}
  document.title = T.title;
  document.querySelectorAll('[data-t]').forEach(e => { if (!(e.id === 'st' && e.dataset.busy)) e.textContent = T[e.dataset.t]; });
  document.querySelectorAll('[data-h]').forEach(e => { e.innerHTML = T['h_' + e.dataset.h]; });
  document.querySelectorAll('.lg button').forEach(b => b.classList.toggle('on', b.dataset.l === LG));
};
document.querySelectorAll('.lg button').forEach(b => b.onclick = () => applyLang(b.dataset.l));
applyLang(LG);
const FW = "__FIRMWARE_B64__";
const $ = id => document.getElementById(id);
const st = (t, cls) => { $('st').textContent = t; $('st').className = cls || ''; $('st').dataset.busy = 1; };
const log = t => { $('log').textContent += t; };
const term = { clean() { $('log').textContent = ''; }, writeLine(t) { log(t + '\n'); }, write(t) { log(t); } };

$('go').onclick = async () => {
  if (!('serial' in navigator)) { st(T.noserial, 'bad'); return; }
  let port, transport;
  try {
    port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x303a }] });
  } catch (e) { st(T.nopick, 'bad'); return; }
  $('go').disabled = true;
  try {
    st(T.connect);
    transport = new Transport(port, false);
    const loader = new ESPLoader({ transport, baudrate: 921600, romBaudrate: 115200, terminal: term });
    const chip = await loader.main();
    log('chip: ' + chip + '\n');
    if (!/ESP32-S3/i.test(chip)) throw new Error(T.wrongchip + ' (' + chip + ')');
    st(T.write);
    // combined image = bootloader (0x0) + partition table (0x8000) + [settings 0x9000..0xE000] + otadata (0xE000) + app (0x10000).
    // Skip the settings area (NVS), otherwise flashing would wipe the device settings.
    const full = atob(FW);
    const parts = [{ data: full.slice(0, 0x9000), address: 0x0 }, { data: full.slice(0xE000), address: 0xE000 }];
    const sizes = parts.map(x => x.data.length), total = sizes[0] + sizes[1];
    await loader.writeFlash({
      fileArray: parts,
      flashSize: 'keep', flashMode: 'keep', flashFreq: 'keep', eraseAll: false, compress: true,
      reportProgress: (i, w, t) => {
        const done = (i > 0 ? sizes[0] : 0) + w / t * sizes[i];
        const p = Math.round(done / total * 100); $('bar').style.width = p + '%'; st(T.write + ' ' + p + '%');
      }
    });
    $('bar').style.width = '100%';
    // 1) Clear RTC_CNTL_FORCE_DOWNLOAD_BOOT (bit 0 of 0x6000812C). Another firmware (auto-updater) may
    //    leave it set; then every reset drops the chip back into the ROM bootloader.
    try {
      const OPT1 = 0x6000812C;
      const before = await loader.readReg(OPT1);
      log('FORCE_DOWNLOAD flag before: ' + (before & 1) + '\n');
      await loader.writeReg(OPT1, 0, 1);
      log('FORCE_DOWNLOAD flag after: ' + ((await loader.readReg(OPT1)) & 1) + '\n');
    } catch (e) { log('flag clear failed: ' + (e && e.message || e) + '\n'); }
    // 2) Reset into the firmware with separate DTR/RTS steps (native USB of ESP32-S3).
    try {
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      await transport.setDTR(false); await sleep(100);
      await transport.setRTS(false); await sleep(100);
      await transport.setRTS(true);  await sleep(100);
      await transport.setRTS(false); await sleep(100);
    } catch (e) {
      log('split reset failed: ' + (e && e.message || e) + '\n');
      try { await loader.after(); } catch (e2) {}
    }
    try { await transport.disconnect(); } catch (e) {}
    st(T.done, 'ok');
  } catch (e) {
    log('\nERROR: ' + (e && e.message || e) + '\n');
    const m = String(e && e.message || e);
    if (/open|busy|access|lock/i.test(m)) st(T.busy, 'bad');
    else st(T.fail1 + m + T.fail2, 'bad');
    try { if (transport) await transport.disconnect(); } catch (e2) {}
    $('go').disabled = false;
  }
};
</script></body></html>
