[env:t-embed-cc1101]
; Built for LilyGO's NATIVE board profile (boards/T_Embed_PN532.json): qio_opi, PSRAM, flash QIO 80MHz, esp32s3.
; Not feather-s3: it drives GPIO21 (screen backlight) before setup(), causing a red flash.
platform = espressif32
board = T_Embed_PN532
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/version.py   ; version from VERSION file -> src/core/version.h

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    h2zero/NimBLE-Arduino @ ^2.1.0
    adafruit/Adafruit NeoPixel @ ^1.12.3

; speed over size: -O2 (flash has headroom, ~36% used)
build_unflags = -Os
build_flags =
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; (the board profile already adds -DBOARD_HAS_PSRAM and -DARDUINO_USB_MODE=1)
    ; ---------- TFT_eSPI config for T-Embed CC1101 (replaces User_Setup) ----------
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_INVERSION_ON=1
    -DTFT_BL=21
    -DTFT_MISO=10
    -DTFT_MOSI=9
    -DTFT_SCLK=11
    -DTFT_CS=41
    -DTFT_DC=16
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
